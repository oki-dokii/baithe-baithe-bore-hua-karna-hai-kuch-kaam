name: Phase 1 checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.4"
      - name: Backend checks
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --extra dev ruff check nwis migrations tests
          uv run --frozen --extra dev pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    env:
      NWIS_DB_PASSWORD: ci-only-database-password
      NWIS_VIEWER_TOKEN: ci-viewer-token-123456789
      NWIS_ENGINEER_TOKEN: ci-engineer-token-123456789
      NWIS_REVIEWER_TOKEN: ci-reviewer-token-123456789
      NWIS_ADMIN_TOKEN: ci-admin-token-123456789
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up --build -d --wait
      - name: Run integration smoke
        run: docker compose exec -T api python -m nwis.smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
