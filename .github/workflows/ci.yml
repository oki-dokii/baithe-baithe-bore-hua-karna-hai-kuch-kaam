name: NWIS checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.4"
      - name: Install PDF/OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Backend checks
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --extra dev ruff check nwis migrations tests
          uv run --frozen --extra dev pytest
        # PDF/OCR fixtures exercise the actual tools, not mocks.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    env:
      NWIS_DB_PASSWORD: ci-only-database-password
      NWIS_VIEWER_TOKEN: ci-viewer-token-123456789
      NWIS_ENGINEER_TOKEN: ci-engineer-token-123456789
      NWIS_REVIEWER_TOKEN: ci-reviewer-token-123456789
      NWIS_ADMIN_TOKEN: ci-admin-token-123456789
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up --build -d --wait
      - name: Rehearse synthetic demo on fresh migrated database
        run: docker compose exec -T api python -m nwis.demo_rehearsal
      - name: Run integration smoke
        run: docker compose exec -T api python -m nwis.smoke
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.4"
      - name: Verify upload, OCR and review transactions
        working-directory: backend
        env:
          NWIS_DATABASE_URL: postgresql+psycopg://nwis:ci-only-database-password@127.0.0.1:5432/nwis
          NWIS_INTEGRATION: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
          docker compose stop worker
          uv sync --frozen --extra dev
          uv run --frozen --extra dev pytest -q tests/test_ingestion_integration.py tests/test_intelligence_integration.py tests/test_operations_integration.py tests/test_prediction_integration.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
