services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: ${NWIS_DB_PASSWORD:?Set NWIS_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis -d nwis"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build: ./backend
    command: ["python", "-m", "nwis.initialize"]
    environment: &backend_environment
      NWIS_DATABASE_URL: postgresql+psycopg://nwis:${NWIS_DB_PASSWORD:?Set NWIS_DB_PASSWORD in .env}@db:5432/nwis
      NWIS_ENVIRONMENT: ${NWIS_ENVIRONMENT:-local}
      NWIS_VIEWER_TOKEN: ${NWIS_VIEWER_TOKEN:?Set NWIS_VIEWER_TOKEN in .env}
      NWIS_ENGINEER_TOKEN: ${NWIS_ENGINEER_TOKEN:?Set NWIS_ENGINEER_TOKEN in .env}
      NWIS_REVIEWER_TOKEN: ${NWIS_REVIEWER_TOKEN:?Set NWIS_REVIEWER_TOKEN in .env}
      NWIS_ADMIN_TOKEN: ${NWIS_ADMIN_TOKEN:?Set NWIS_ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./specs:/app/specs:ro
    restart: "no"

  api:
    build: ./backend
    command: ["uvicorn", "nwis.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./specs:/app/specs:ro
    ports:
      - "127.0.0.1:${NWIS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "nwis.worker"]
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./specs:/app/specs:ro

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NWIS_WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
